; =============================================================================
; Project:       FoxMesh
; Author:        Tom OE3TKT
; Platform:      espressif32
; Description:   PlatformIO Project Configuration File
; =============================================================================

[platformio]
; Enable global PlatformIO Cache
build_cache_dir = ~/.platformio/.cache

; =============================================================================
; CUSTOM ENVIRONMENT PROFILE (Keeps custom options clear of warnings)
; =============================================================================
[extra]
; Defines the generic ESP32 I2C standard pins and basic warnings
standard_src_flags =
    -Wall
    -Wextra
    -Wno-error=pedantic
    -Wconversion
    -Wshadow
    -Wno-include-next
    -D BOARD_I2C_SDA=21
    -D BOARD_I2C_SCL=22

; =============================================================================
; GLOBAL CONFIGURATION FOR ALL ENVIRONMENTS (Inherited by all environments)
; =============================================================================
[env]
; Global build flags applied to every board environment
platform = espressif32
framework = espidf

; Shared serial communication settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Global build flags applied to EVERY build target
build_flags =
    -D CCACHE_ENABLE=1
    ; Treats ESP-IDF libc extensions headers as system headers to suppress external warnings
    ; -isystem /home/tom/.platformio/packages/framework-espidf/components/esp_libc/platform_include
    -Wno-include-next
; --- STRICT MODE FOR PROJECT APPLICATION CODE ONLY ---
    ;-Wno-pedantic
    #-DGIT_HASH=\"\"${sysenv.GIT_HASH}\"\"
    !echo -DGIT_HASH=\\\"$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")\\\"
    !echo -DGIT_TAG=\\\"$(git describe --tags --always 2>/dev/null || echo "v0.0.0")\\\"

; Base compile flags for our own /src files (Standard ESP32 I2C configuration)
;default_src_flags =
    ; Enables all standard compiler warning flags
;    -Wall
    ; Enables additional strict development warnings
;    -Wextra
    ; Enforces strict ISO C++ standard compliance on application source files
    ;-Wpedantic
    ; FIXED: Prevents third-party IDF anonymous structs from breaking the C++ build
;    -Wno-error=pedantic
    ; Warns on implicit type conversions (e.g., int to uint8_t)
;    -Wconversion
    ; Warns if a local variable shadows another variable in scope
;    -Wshadow
;    -Wno-include-next
    ; Promotes all warnings to hard compilation errors to guarantee clean code
    ;-Werror
    ;-D MATH_COMPARE=1
    ; --- Board-specific hardware mapping ---
;    -D BOARD_I2C_SDA=21
;    -D BOARD_I2C_SCL=22

; =============================================================================
; BOARD ENVIRONMENTS
; =============================================================================

; -----------------------------------------------------------------------------
; TTGO LoRa32 v2.1 (Classic ESP32 target)
; -----------------------------------------------------------------------------
[env:ttgo-lora32-v21]
board = ttgo-lora32-v21
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; These flags are strictly applied ONLY to C++ files inside the src/ directory.
; Smoothly pulls in the default warning profile and standard I2C pins
build_src_flags =
    ${extra.standard_src_flags}
    -D BOARD_LED_PIN=25
    -D BOARD_LORA_RST=23

; -----------------------------------------------------------------------------
; LilyGo T-Beam S3 Supreme (ESP32-S3 target)
; -----------------------------------------------------------------------------
[env:t-beams3-supreme]
board = t-beams3-supreme
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_mode = qio
board_build.f_flash = 80000000L
; board_build.partitions = default_8MB.csv
; FIXED: Uses the framework's native 8MB partition layout instead of a missing local CSV
; board_build.partitions = partitions_two_ota_8MB.csv
; Removed board_build_partitions to let ESP-IDF handle it via sdkconfig

; Smoothly pulls in the default warning profile and standard I2C pins
; Compiler flags strictly applied ONLY to source files inside the src/ directory
build_src_flags =
    -Wall
    -Wextra
    -Wno-error=pedantic
    -Wconversion
    -Wshadow
    -Wno-include-next
    ; --- PMU / I2C Bus Mapping ---
    -D BOARD_I2C_SDA=17
    -D BOARD_I2C_SCL=18
    -D BOARD_PMU_IRQ=42
    ; --- Onboard Peripherals ---
    -D BOARD_LED_PIN=4
    ; --- LoRa SPI & Control Pins (SX1262) ---
    -D BOARD_LORA_SCK=12
    -D BOARD_LORA_MISO=13
    -D BOARD_LORA_MOSI=11
    -D BOARD_LORA_CS=10
    -D BOARD_LORA_RST=5
    -D BOARD_LORA_BUSY=4
    -D BOARD_LORA_DIO1=1
    ; --- u-blox M10S GPS UART Pins ---
    -D BOARD_GPS_TX=8        ; ESP32-S3 RX pin (receives data from GNSS)
    -D BOARD_GPS_RX=9        ; ESP32-S3 TX pin (transmits data to GNSS)
    -D BOARD_GPS_PPS=6       ; Hardware time pulse input
    -D BOARD_GPS_EN=7        ; GNSS hardware sleep/wake control line
    -D BOARD_GPS_BAUD=38400  ; Factory default baud rate for u-blox M10S

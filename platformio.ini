; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Enable global PlatformIO Cache
build_cache_dir = ~/.platformio/.cache

[env:ttgo-lora32-v21]
platform = espressif32
board = ttgo-lora32-v21
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; lib_deps = bodmer/TFT_eSPI@^2.5.43

; Zwingt PlatformIO, die mit Core 6.2.0 kompatible SCons-Version zu nutzen
platform_packages =
    platformio/tool-scons @ ~4.41101.0

; Hardware-specific macro definitions
build_flags =
    ;-D CONFIG_IDF_TARGET_ESP32=y
    -D CCACHE_ENABLE=1

; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

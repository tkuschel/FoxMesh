; PlatformIO Project Configuration File
; Project: FoxMesh
; Author: Tom OE3TKT

[platformio]
; Enable global PlatformIO Cache
build_cache_dir = ~/.platformio/.cache

[env:ttgo-lora32-v21]
platform = espressif32
board = ttgo-lora32-v21
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; lib_deps = bodmer/TFT_eSPI@^2.5.43

; Forces PlatformIO to use the customized SCons engine to prevent firmware.elf build errors
;platform_packages =
;    platformio/tool-scons @ ~4.41101.0

; Advanced Compiler Configurations and Maximum Warning Profiles
build_flags =
    ; REMOVED: CONFIG_IDF_TARGET_ESP32 (automatically predefined by PlatformIO's framework engine)

    -D CCACHE_ENABLE=1
    -Wno-error=pedantic
    -Wno-pedantic
    -Wno-gnu-include-next

; --- STRICT MODE FOR MY OWN CODE ONLY ---
; These flags are strictly applied ONLY to files inside the src/ directory.
; The ESP-IDF framework is completely excluded from these rules!
    ; Maximum Compiler Warnings (Strict Mode)
build_src_flags =
    -Wall             ; Enables all standard compiler warning flags
    -Wextra           ; Enables additional strict development warnings
    -Wpedantic        ; Enforces strict ISO C++ standard compliance (only on own files)
    -Wconversion      ; Warns on implicit type conversions (e.g., int to uint8_t)
    -Wshadow          ; Warns if a local variable shadows another variable in scope
    -Werror           ; Promotes all warnings to hard compilation errors to guarantee clean code
    -Wno-gnu-include-next   ; no warning to #include_next (GNU extension), used in static_assert()

; Serial flashing interface configuration overrides (leave commented out for dynamic CLI arguments)
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
